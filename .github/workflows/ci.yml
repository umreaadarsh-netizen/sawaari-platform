name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test · Typecheck · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Fails loudly if package.json and bun.lock drift apart.
        run: bun install --frozen-lockfile

      - name: Typecheck
        # src/convex/_generated is committed (see .gitignore) so this needs no
        # Convex deployment credentials in CI.
        run: bunx tsc -b --noEmit

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

  deploy:
    name: Deploy Convex (dev)
    # Deploy the default branch only, and only after tests/typecheck/lint pass.
    if: github.ref_name == github.event.repository.default_branch
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy functions to the Convex dev deployment
        # CONVEX_DEPLOY_KEY is a deploy key created for the dev deployment
        # (Convex dashboard → dev deployment → Settings → Deploy keys). The key
        # both authenticates the CLI and selects the deployment it was created
        # for, so no deployment URL is needed here.
        run: 'bunx convex deploy --message "CI: ${{ github.sha }}"'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
